; RGB EEG study - LabRecorder config (launch: LabRecorder.exe -c C:\braineeg\tools\LabRecorder\rgb_eeg.cfg)
; One stim run = one XDF file: Stop -> change file name -> Update -> check streams -> Start

StudyRoot=C:/braineeg/Experiment/rgb-eeg-lab-v4/rgb-eeg-lab/data
; Default file name: replace each ? with participant/run number before Start ('?' is invalid in Windows file names -> no recording)
; PathTemplate present -> LabRecorder starts with BIDS unchecked (legacy mode)
PathTemplate=sub-P00?_ses-main_run-0?.xdf

; Required streams: pre-checked on launch, shown in red when missing, warning dialog on Start.
; Names copied from data/sub-T00_ses-systemtest_run-01.xdf (2026-11-03). No spaces inside parentheses.
RequiredStreams="BA HALO 114_HALO_BrainAccess (DESKTOP-CFL7VMR)", "RGB_Markers (DESKTOP-CFL7VMR)"

RCSEnabled=1
RCSPort=22345
